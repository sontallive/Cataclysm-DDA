name: Linux x86_64 Build
run-name: Linux x86_64 · ${{ github.ref_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the successful build as a GitHub prerelease
        type: boolean
        default: false
      translations_tag:
        description: Official CDDA release supplying translations (empty = newest available)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translations:
    name: Prepare translations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.translations.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Download and validate official translations
        id: translations
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSLATIONS_TAG: ${{ inputs.translations_tag }}
        run: |
          set -euo pipefail
          tag="$TRANSLATIONS_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh api 'repos/CleverRaven/Cataclysm-DDA/releases?per_page=30' --jq \
              '[.[] | select(.draft == false) | select(.tag_name | startswith("cdda-experimental-")) | select(any(.assets[]; .name | startswith("cdda-translations-")))][0].tag_name')"
          fi
          if [[ "$tag" != cdda-experimental-* ]]; then
            echo "::error::No official experimental translation release found: $tag"
            exit 1
          fi
          archive_dir="$RUNNER_TEMP/translations"
          mkdir -p "$archive_dir"
          gh release download "$tag" --repo CleverRaven/Cataclysm-DDA \
            --pattern 'cdda-translations-*.tar.gz' --dir "$archive_dir"
          archives=("$archive_dir"/*.tar.gz)
          test "${#archives[@]}" -eq 1
          tar -xzf "${archives[0]}" -C "$GITHUB_WORKSPACE"
          test -s lang/po/zh_CN.po
          for po in lang/po/*.po; do
            # Match the game's msgfmt flags, including fuzzy translations.
            if ! msgfmt -f -o /dev/null "$po"; then
              if [[ "$po" == lang/po/zh_CN.po || "$po" == lang/po/zh_TW.po ]]; then
                echo "::error file=$po::Chinese translation is invalid"
                exit 1
              fi
              echo "::warning file=$po::Skipping invalid translation from $tag"
              printf -- '- Skipped invalid translation: %s\n' "$po" >> "$GITHUB_STEP_SUMMARY"
              rm -- "$po"
            fi
          done
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'Translation source: %s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-translations
          path: |
            lang/po
            src/lang_stats.inc
            data/credits
            data/motd
          if-no-files-found: error
          retention-days: 7

  tilesets:
    uses: ./.github/workflows/compose-tilesets.yml

  shaders:
    name: Build Linux shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test shortcut input and history
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined \
            -Isrc -Itests -isystem src/third-party -DCATCH_CONFIG_MAIN \
            tests/touch_shortcuts_test.cpp src/touch_shortcuts.cpp \
            -o "$RUNNER_TEMP/touch-shortcuts-test"
          "$RUNNER_TEMP/touch-shortcuts-test" '[touch_shortcuts]'
      - name: Compile Linux shaders
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          python3 tools/build_shaders.py --formats spv --stamp data/shaders/build-spv.stamp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdda-shaders
          path: |
            data/shaders/*.spv
            data/shaders/build-spv.stamp
          if-no-files-found: error
          retention-days: 7

  build:
    name: Linux x86_64 graphics and audio
    needs: [translations, tilesets, shaders]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libncursesw5-dev ccache gettext parallel patchelf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: linux-clang18-sdl3-${{ github.sha }}
          restore-keys: linux-clang18-sdl3-
      - uses: ./.github/actions/setup-sdl3-stack
        with:
          cache-key: sdl3-stack-strict-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-ubuntu-24.04-v2
          prefix: ${{ runner.temp }}/sdl3_prefix
          stage-licenses: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-translations
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tileset-*
          path: gfx
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdda-shaders
          path: data/shaders
      - name: Build libbacktrace
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git "$RUNNER_TEMP/libbacktrace"
          cd "$RUNNER_TEMP/libbacktrace"
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j"$(nproc)"
          cp LICENSE "$GITHUB_WORKSPACE/LICENSE-libbacktrace.txt"
          sudo make install
      - name: Record build provenance
        id: version
        env:
          TRANSLATIONS_TAG: ${{ needs.translations.outputs.tag }}
        run: |
          tag="cdda-linux-$(date -u +%Y-%m-%d-%H%M)-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          {
            echo 'build type: linux-with-graphics-and-sounds-x64'
            echo "build number: $tag"
            echo "commit sha: $GITHUB_SHA"
            echo "commit url: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "translation release: $TRANSLATIONS_TAG"
            echo 'touch shortcuts: opt in with --touch-shortcuts (off by default)'
          } > VERSION.txt
      - name: Compile and package
        run: |
          # Downloaded shader stamps must be newer than the checked-out sources.
          test -n "$(find data/shaders -maxdepth 1 -name '*.spv' -print -quit)"
          touch data/shaders/*.spv data/shaders/build-spv.stamp
          make COMPILER=clang++-18 -j"$(nproc)" CCACHE=1 TILES=1 SOUND=1 \
            RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=1 \
            WARN_STALE_DATA=1 PCH=0 BUILD_SHADER_FORMATS=spv bindist
          mkdir -p dist
          archives=(cataclysmdda-*.tar.gz)
          test "${#archives[@]}" -eq 1
          mv "${archives[0]}" dist/cdda-linux-x86_64.tar.gz
          cp VERSION.txt dist/VERSION.txt
          (cd dist && sha256sum cdda-linux-x86_64.tar.gz > SHA256SUMS)
          ccache --show-stats
      - name: Verify packaged runtime
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          tar -xzf dist/cdda-linux-x86_64.tar.gz -C "$RUNNER_TEMP/verify"
          mapfile -t executables < <(find "$RUNNER_TEMP/verify" -type f -name cataclysm-tiles)
          test "${#executables[@]}" -eq 1
          exe="${executables[0]}"
          env -u LD_LIBRARY_PATH ldd "$exe" | tee "$RUNNER_TEMP/bundled-deps.txt"
          if grep -q 'not found' "$RUNNER_TEMP/bundled-deps.txt"; then
            echo '::error::The packaged game has unresolved runtime dependencies'
            exit 1
          fi
          grep -E 'libSDL3.*verify/.*/lib/' "$RUNNER_TEMP/bundled-deps.txt"
          env -u LD_LIBRARY_PATH "$exe" --version
          env -u LD_LIBRARY_PATH "$exe" --help | grep -- '--touch-shortcuts'
          printf 'Built Linux x86_64 package from %s. Download **cdda-linux-x86_64** below.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdda-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Linux prerelease
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdda-linux-x86_64
          path: dist
      - name: Create release after validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" \
            --title "CDDA Linux x86_64 · $RELEASE_TAG" --prerelease \
            --notes-file dist/VERSION.txt
